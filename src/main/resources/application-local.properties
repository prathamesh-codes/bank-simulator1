server.port=7000
server.ssl.enabled=false

spring.datasource.url=jdbc:h2:mem:simulatordb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false


# -------------------------------------------------------------------
# CAB simulator configuration
# -------------------------------------------------------------------

# Actual Payment Aggregator endpoint that CAB's API-3 callback
# ultimately needs to POST to.
#
# For your current standalone testing this may be:
# http://localhost:7000/test-callback
#
# When testing against the actual PG application, change this to:
# http://localhost:8443/pgidsk/servlet/PGIBankResponseHandler
simulator.cab.confirmation-url=http://localhost:9090/pg/test-callback


# Internal CAB adapter.
#
# Generic SimulatorService sends its normal CallbackDelivery here.
# CabCallbackController converts that request into CAB's required
# application/x-www-form-urlencoded POST.
simulator.cab.callback-adapter-url=http://localhost:7000/internal/cab/callback


# CAB encryption configuration
simulator.cab.encryption-key=12345678901234567890123456789012
simulator.cab.checksum-key=12345678901234567890123456789012
simulator.cab.iv=1234567890ABCDEF


# -------------------------------------------------------------------
# Simulator configuration
# -------------------------------------------------------------------

simulator.delay.default-seconds=5
simulator.delay.max-seconds=120
simulator.duplicate.second-call-delay-ms=1500